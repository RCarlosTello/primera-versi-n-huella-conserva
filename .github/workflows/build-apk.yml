name: Compilar APK Android

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias web
        run: npm install

      - name: Empaquetar estáticos en www
        run: |
          mkdir -p www
          cp -r app data styles index.html imagen.png logo.jpeg www/
          
      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Compilar APK con Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: huella_conserva.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
